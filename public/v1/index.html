<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCouper - 舊版介面</title>
  <style>
    :root {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --primary: #e4002b;
      --primary-light: #ff6b35;
      --border: #e5e5e5;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --bg-card: #1a1a1a;
        --text: #fafafa;
        --text-muted: #a1a1a1;
        --border: #2a2a2a;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    .dark {
      --bg: #0a0a0a;
      --bg-card: #1a1a1a;
      --text: #fafafa;
      --text-muted: #a1a1a1;
      --border: #2a2a2a;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    .light {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e5e5e5;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 1.125rem;
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-link:hover {
      color: var(--text);
      background: var(--border);
    }

    .nav-link.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
    }

    .nav-link.primary:hover {
      opacity: 0.9;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      color: var(--text);
      background: var(--border);
    }

    /* Main Content */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .hero {
      text-align: center;
      padding: 2rem 0 3rem;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .version-badge {
      display: inline-block;
      background: var(--border);
      color: var(--text-muted);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-top: 1rem;
    }

    /* Coupon Grid */
    .coupon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .coupon-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.2s;
    }

    .coupon-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--shadow);
    }

    .coupon-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .coupon-name {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .coupon-discount {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .coupon-code {
      display: inline-block;
      background: var(--border);
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .coupon-price {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .coupon-price .current {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .coupon-price .original {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .coupon-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    @media (max-width: 640px) {
      .hero h1 {
        font-size: 1.5rem;
      }

      .coupon-grid {
        grid-template-columns: 1fr;
      }

      .nav-link span {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <div class="logo-icon">K</div>
        <span class="logo-text">KCouper</span>
      </div>
      <nav class="nav">
        <a href="/" class="nav-link primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
          <span>切換新版 v2</span>
        </a>
        <button class="theme-toggle" id="themeToggle" title="切換主題">
          <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <h1>KFC 優惠券資訊</h1>
      <p>台灣肯德基優惠券快速查詢</p>
      <span class="version-badge">舊版介面 v1</span>
    </section>

    <div class="coupon-grid" id="couponGrid">
      <!-- Coupons will be rendered here -->
    </div>
  </main>

  <footer class="footer">
    <p>KCouper © 2025 - 非官方優惠券資訊網站</p>
  </footer>

  <script src="/coupon.js"></script>
  <script>
    /**
     * Theme management
     */
    function initTheme() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
        updateThemeIcon(true);
      } else if (stored === 'light') {
        document.documentElement.classList.add('light');
        updateThemeIcon(false);
      }
    }

    function updateThemeIcon(isDark) {
      document.getElementById('sunIcon').style.display = isDark ? 'none' : 'block';
      document.getElementById('moonIcon').style.display = isDark ? 'block' : 'none';
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      
      if (isDark) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('theme', 'light');
        updateThemeIcon(false);
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        updateThemeIcon(true);
      }
    }

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    initTheme();

    /**
     * Render coupons
     */
    function renderCoupons() {
      const grid = document.getElementById('couponGrid');
      const coupons = window.COUPON_DICT?.coupon_list || [];

      if (coupons.length === 0) {
        grid.innerHTML = '<p style="text-align: center; color: var(--text-muted);">無優惠券資料</p>';
        return;
      }

      grid.innerHTML = coupons.map(coupon => `
        <div class="coupon-card">
          <div class="coupon-header">
            <span class="coupon-name">${escapeHtml(coupon.name)}</span>
            <span class="coupon-discount">-${coupon.discount}%</span>
          </div>
          <div class="coupon-code">${coupon.coupon_code}</div>
          <div class="coupon-price">
            <span class="current">$${coupon.price}</span>
            <span class="original">$${coupon.original_price}</span>
          </div>
          <div class="coupon-date">有效期限: ${coupon.start_date} ~ ${coupon.end_date}</div>
        </div>
      `).join('');
    }

    /**
     * Escape HTML to prevent XSS
     * @param {string} text
     * @returns {string}
     */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    renderCoupons();
  </script>
</body>
</html>
